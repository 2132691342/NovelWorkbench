# NovelWorkbench 容器化编排：应用容器 + 可选本地中间件（profile: infra）
# 对外只暴露一个入口端口（默认 14399），前端 nginx 反代 /api 到后端容器。
# 所有凭据从 .env 注入（cp .env.example .env 后填写），本文件不含任何可用口令。
# podman：podman-compose up -d --build ；docker：docker compose up -d --build
name: novel-workbench

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: novel-workbench-backend:latest
    container_name: nw-backend
    restart: unless-stopped
    environment:
      NW_SERVER_PORT: "8080"
      NW_JWT_SECRET: ${NW_JWT_SECRET:?未设置 JWT 密钥}
      NW_POSTGRES_HOST: ${NW_POSTGRES_HOST:?未设置数据库地址}
      NW_POSTGRES_PORT: ${NW_POSTGRES_PORT:-5432}
      NW_POSTGRES_USER: ${NW_POSTGRES_USER:-postgres}
      NW_POSTGRES_PASSWORD: ${NW_POSTGRES_PASSWORD:?未设置数据库口令}
      NW_POSTGRES_DBNAME: ${NW_POSTGRES_DBNAME:-postgres}
      NW_REDIS_ADDR: ${NW_REDIS_ADDR:?未设置缓存地址}
      NW_REDIS_PASSWORD: ${NW_REDIS_PASSWORD:?未设置缓存口令}
      NW_RABBITMQ_URL: ${NW_RABBITMQ_URL:?未设置队列连接串}
      NW_MINIO_ENDPOINT: ${NW_MINIO_ENDPOINT:?未设置对象存储地址}
      NW_MINIO_ACCESS_KEY: ${NW_MINIO_ACCESS_KEY:?未设置对象存储账号}
      NW_MINIO_SECRET_KEY: ${NW_MINIO_SECRET_KEY:?未设置对象存储口令}
      NW_MINIO_BUCKET: ${NW_MINIO_BUCKET:-novelworkbench}
      NW_MANTICORE_BASE_URL: ${NW_MANTICORE_BASE_URL:?未设置全文检索地址}
      NW_AI_PROTOCOL_CODE: ${NW_AI_PROTOCOL_CODE:-openai}
      NW_AI_BASE_URL: ${NW_AI_BASE_URL:-}
      NW_AI_API_KEY: ${NW_AI_API_KEY:-}
      NW_AI_CHAT_MODEL: ${NW_AI_CHAT_MODEL:-}
      NW_AI_TEMPERATURE: ${NW_AI_TEMPERATURE:-0.7}
      NW_AI_MAX_TOKENS: ${NW_AI_MAX_TOKENS:-2048}
      NW_AI_TIMEOUT_SEC: ${NW_AI_TIMEOUT_SEC:-120}
      NW_AI_HISTORY_COUNT: ${NW_AI_HISTORY_COUNT:-5}
      NW_APP_UPLOAD_MAX_MB: ${NW_APP_UPLOAD_MAX_MB:-20}
      NW_APP_CHUNK_SIZE: ${NW_APP_CHUNK_SIZE:-800}
      NW_APP_CHUNK_OVERLAP: ${NW_APP_CHUNK_OVERLAP:-120}
      NW_APP_RAG_TOP_K: ${NW_APP_RAG_TOP_K:-6}
      NW_APP_ADMIN_PASSWORD: ${NW_APP_ADMIN_PASSWORD:?未设置引导管理员密码}
      NW_APP_BUILD_VERSION: ${NW_APP_BUILD_VERSION:-dev}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: novel-workbench-frontend:latest
    container_name: nw-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGINX_RESOLVER: "127.0.0.11"          # docker 内嵌 DNS（podman 用网关地址），按请求重解析上游
      API_UPSTREAM: "http://backend:8080"
      NW_LISTEN_PORT: "80"                  # 容器内监听端口，宿主端口由下面的 ports 决定
      NW_CLIENT_MAX_BODY_SIZE: "20m"        # 反代上传上限，与后端 NW_APP_UPLOAD_MAX_MB 对齐
    ports:
      - "${NW_PUBLIC_PORT:-14399}:80"       # 唯一对外入口：http://<host>:14399
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- 以下为本地中间件（--profile infra 时启动），仅用于本地开发；口令来自 .env ----
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["infra"]
    container_name: nw-postgres
    environment:
      POSTGRES_USER: ${NW_POSTGRES_USER:?未设置数据库账号}
      POSTGRES_PASSWORD: ${NW_POSTGRES_PASSWORD:?未设置数据库口令}
      POSTGRES_DB: ${NW_POSTGRES_DBNAME:?未设置数据库名}
    ports:
      - "5432:5432"
    volumes:
      - nw_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    profiles: ["infra"]
    container_name: nw-redis
    command: ["redis-server", "--requirepass", "${NW_REDIS_PASSWORD:?未设置缓存口令}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    profiles: ["infra"]
    container_name: nw-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${NW_MINIO_ACCESS_KEY:?未设置对象存储账号}
      MINIO_ROOT_PASSWORD: ${NW_MINIO_SECRET_KEY:?未设置对象存储口令}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nw_minio_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["infra"]
    container_name: nw-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${NW_RABBITMQ_USER:?未设置队列账号}
      RABBITMQ_DEFAULT_PASS: ${NW_RABBITMQ_PASSWORD:?未设置队列口令}
    ports:
      - "5672:5672"
      - "15672:15672"

  manticore:
    image: manticoresearch/manticore:latest
    profiles: ["infra"]
    container_name: nw-manticore
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - nw_manticore_data:/var/lib/manticore

volumes:
  nw_pg_data:
  nw_minio_data:
  nw_manticore_data:
