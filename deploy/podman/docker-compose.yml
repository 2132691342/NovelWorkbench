# NovelWorkbench podman 部署：仅应用容器，加入既有中间件网络（默认 novelworkbench_default）。
# 目标主机为 Podman + podman-compose（无 Docker）；镜像由 deploy.sh 基于预构建产物构建。
# 凭据与端口一律由 .env 注入，本文件不提供任何可用默认值。
services:
  backend:
    image: ${NW_BACKEND_IMAGE:-localhost/novel-workbench-backend:latest}
    container_name: nw-backend
    restart: always
    networks:
      - infra
    mem_limit: 384m
    environment:
      NW_SERVER_MODE: "release"
      NW_SERVER_PORT: "8080"
      NW_JWT_SECRET: ${NW_JWT_SECRET:?未设置 JWT 密钥}
      NW_POSTGRES_HOST: postgres
      NW_POSTGRES_PORT: "5432"
      NW_POSTGRES_PASSWORD: ${NW_POSTGRES_PASSWORD:?未设置数据库口令}
      NW_REDIS_ADDR: redis:6379
      NW_REDIS_PASSWORD: ${NW_REDIS_PASSWORD:?未设置 Redis 口令}
      NW_RABBITMQ_URL: amqp://${NW_RABBITMQ_USER:-admin}:${NW_RABBITMQ_PASSWORD:?未设置队列口令}@rabbitmq:5672/
      NW_MINIO_ENDPOINT: minio:9000
      NW_MINIO_ACCESS_KEY: ${NW_MINIO_ACCESS_KEY:?未设置对象存储账号}
      NW_MINIO_SECRET_KEY: ${NW_MINIO_SECRET_KEY:?未设置对象存储口令}
      NW_MANTICORE_BASE_URL: http://manticore:9308
      NW_AI_PROTOCOL_CODE: ${NW_AI_PROTOCOL_CODE:-openai}
      # 模型网关非启动必需：留空则不播种出厂供应商，登录后在「模型供应商」页维护
      NW_AI_BASE_URL: ${NW_AI_BASE_URL:-}
      NW_AI_API_KEY: ${NW_AI_API_KEY:-}
      NW_AI_CHAT_MODEL: ${NW_AI_CHAT_MODEL:-}
      NW_AI_TEMPERATURE: ${NW_AI_TEMPERATURE:-0.7}
      NW_AI_MAX_TOKENS: ${NW_AI_MAX_TOKENS:-2048}
      NW_AI_TIMEOUT_SEC: ${NW_AI_TIMEOUT_SEC:-120}
      NW_AI_HISTORY_COUNT: ${NW_AI_HISTORY_COUNT:-5}
      NW_APP_UPLOAD_MAX_MB: ${NW_APP_UPLOAD_MAX_MB:-20}
      NW_APP_CHUNK_SIZE: ${NW_APP_CHUNK_SIZE:-800}
      NW_APP_CHUNK_OVERLAP: ${NW_APP_CHUNK_OVERLAP:-120}
      NW_APP_RAG_TOP_K: ${NW_APP_RAG_TOP_K:-6}
      NW_APP_ADMIN_PASSWORD: ${NW_APP_ADMIN_PASSWORD:?未设置引导管理员密码}
      NW_APP_BUILD_VERSION: ${NW_APP_BUILD_VERSION:-dev}
    # 后端只加入中间件网络，由前端 nginx 反向代理；健康检查走 podman exec，
    # 不映射宿主端口，避免 rootless podman 重建后的陈旧 DNAT 规则。
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${NW_FRONTEND_IMAGE:-localhost/novel-workbench-frontend:latest}
    container_name: nw-frontend
    restart: always
    networks:
      - infra
    depends_on:
      - backend
    environment:
      # podman aardvark/dnsname 只应答 search 域 FQDN（resolv.conf 的 search dns.podman），
      # nginx resolver 不做后缀补全，故上游必须写完整域名
      NGINX_RESOLVER: ${NW_NGINX_RESOLVER:-10.89.0.1}
      API_UPSTREAM: ${NW_API_UPSTREAM:-http://backend.dns.podman:8080}
      NW_LISTEN_PORT: "80"
      NW_CLIENT_MAX_BODY_SIZE: ${NW_CLIENT_MAX_BODY_SIZE:-20m}
    ports:
      - "${NW_PUBLIC_PORT:-14399}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # 加入既有中间件栈网络（网络名由 NW_INFRA_NETWORK 指定，默认见 .env.example）。
  infra:
    external: true
    name: ${NW_INFRA_NETWORK:-novelworkbench_default}
