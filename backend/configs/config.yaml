server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"            # debug/release/test
  read_timeout_sec: 30
  write_timeout_sec: 0     # 0：SSE 长连接不受写超时限制

jwt:
  secret: "novel-workbench-dev-secret-change-me"
  expire_hours: 168        # 7 天

postgres:
  host: "47.108.73.153"
  port: 5432
  user: "postgres"
  password: "admin_public"
  dbname: "postgres"
  sslmode: "disable"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime_min: 30

redis:
  addr: "47.108.73.153:6379"
  password: "admin_public"
  db: 0

rabbitmq:
  url: "amqp://admin:admin_public@47.108.73.153:5672/"
  queue_doc_index: "nw_doc_index"

minio:
  endpoint: "47.108.73.153:9000"
  access_key: "minioadmin"
  secret_key: "minioadminpublic"
  bucket: "novelworkbench"
  use_ssl: false

manticore:
  base_url: "http://47.108.73.153:9308"
  table_chunks: "nw_chunks"

ai:
  # 以下为"出厂默认供应商"：仅在 model_providers 表为空时播种一条记录，
  # 之后请在「模型供应商」页面维护（支持 OpenAI 兼容 / Anthropic 双协议、多供应商、连通性测试）。
  protocol_code: "openai"   # openai / anthropic
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # OpenAI 兼容需含 /v1；Anthropic 填根地址
  api_key: "sk-your-api-key"
  chat_model: "qwen-plus"
  embedding_model: "text-embedding-v3"
  embedding_dim: 1024
  temperature: 0.7
  max_tokens: 2048
  timeout_sec: 120
  history_count: 5          # @历史引用默认条数（可被请求覆盖）

app:
  upload_max_mb: 20
  build_version: "dev"      # 运行状态页展示的构建版本（发布时用 NW_APP_BUILD_VERSION 注入）
  chunk_size: 800           # 知识库切片字符数
  chunk_overlap: 120        # 切片重叠字符数
  rag_top_k: 6              # RAG 默认召回条数
  admin_password: "Admin@123456"  # 引导管理员初始密码（仅用户表为空时生效；生产必须用 NW_APP_ADMIN_PASSWORD 覆盖）
