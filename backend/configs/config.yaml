server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"            # debug/release/test
  read_timeout_sec: 30
  write_timeout_sec: 0     # 0：SSE 长连接不受写超时限制

jwt:
  secret: ""              # NW_JWT_SECRET（必填，生产必须设置随机长串）
  expire_hours: 168        # 7 天

postgres:
  host: ""                # NW_POSTGRES_HOST
  port: 5432              # NW_POSTGRES_PORT
  user: "postgres"        # 非敏感默认账号；NW_POSTGRES_USER 可覆盖
  password: ""            # NW_POSTGRES_PASSWORD（必填）
  dbname: "postgres"      # 非敏感默认库名；NW_POSTGRES_DBNAME 可覆盖
  sslmode: "disable"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime_min: 30

redis:
  addr: ""                # NW_REDIS_ADDR（host:port）
  password: ""            # NW_REDIS_PASSWORD
  db: 0

rabbitmq:
  url: ""                 # NW_RABBITMQ_URL（amqp://user:pass@host:5672/）
  queue_doc_index: "nw_doc_index"

minio:
  endpoint: ""            # NW_MINIO_ENDPOINT（host:port）
  access_key: ""          # NW_MINIO_ACCESS_KEY
  secret_key: ""          # NW_MINIO_SECRET_KEY
  bucket: "novelworkbench"
  use_ssl: false

manticore:
  base_url: ""            # NW_MANTICORE_BASE_URL（http://host:9308）
  table_chunks: "nw_chunks"

ai:
  # 出厂默认供应商：仅在 model_providers 表为空时播种一条记录，
  # 之后在「模型供应商」页面维护（支持 OpenAI 兼容 / Anthropic 双协议、多供应商、连通性测试）。
  # 部署时通过 NW_AI_* 环境变量注入；跟踪文件中的值一律留空。
  protocol_code: "openai"   # NW_AI_PROTOCOL_CODE：openai / anthropic
  base_url: ""              # NW_AI_BASE_URL（OpenAI 兼容需含 /v1；Anthropic 填根地址）
  api_key: ""               # NW_AI_API_KEY
  chat_model: ""            # NW_AI_CHAT_MODEL
  temperature: 0.7          # NW_AI_TEMPERATURE
  max_tokens: 2048          # NW_AI_MAX_TOKENS
  timeout_sec: 120          # NW_AI_TIMEOUT_SEC

app:
  upload_max_mb: 20         # NW_APP_UPLOAD_MAX_MB
  build_version: ""         # NW_APP_BUILD_VERSION（运行状态页展示；缺省 dev）
  chunk_size: 800           # NW_APP_CHUNK_SIZE：知识库切片字符数
  chunk_overlap: 120        # NW_APP_CHUNK_OVERLAP：切片重叠字符数
  rag_top_k: 6              # NW_APP_RAG_TOP_K：RAG 默认召回条数
  admin_password: ""        # NW_APP_ADMIN_PASSWORD（仅用户表为空时生效；生产必填）
