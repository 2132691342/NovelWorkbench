# 发布：推送 main 且打 tag（如 v1.0.0）时构建并推送镜像到 GHCR
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image prefix (GHCR requires lowercase)
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 后端镜像由 backend/Dockerfile 构建：CGO_ENABLED=0 静态编译（见该文件）
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/backend:${{ github.ref_name }}
            ${{ steps.img.outputs.prefix }}/backend:latest
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.img.outputs.prefix }}/frontend:${{ github.ref_name }}
            ${{ steps.img.outputs.prefix }}/frontend:latest
