# CI：后端静态检查与测试、前端类型检查与构建；镜像发布见 release.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build（禁 cgo 静态构建）
        run: CGO_ENABLED=0 go build -tags "netgo osusergo" ./...
      - name: Test（仅复杂链路，-short 跳过外部依赖）
        run: go test -short -count=1 -shuffle=on ./...

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type Check & Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t novel-workbench-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t novel-workbench-frontend:ci ./frontend
